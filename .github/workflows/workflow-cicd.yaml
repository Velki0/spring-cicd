name: Qualité de Code

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire Maven
        run: mvn -B clean verify -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Sauvegarder le rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Générer le site Maven
        run: mvn site

      - name: Sauvegarder le rapport Checkstyle
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/site

      - name: Publier le rapport SpotBugs
        uses: actions/upload-artifact@v4
        with:
          name: rapport-spotbugs
          path: target/spotbugs/

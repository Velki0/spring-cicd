name: Configuration Java

on:
  workflow_dispatch

jobs:
  affichage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Afficher Java Version
      run: java -version

    - name: Afficher Maven Version
      run: mvn --version
